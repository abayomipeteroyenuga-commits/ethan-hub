<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ethan ID Verification</title>
<style>body{font-family:Arial,sans-serif;background:#f7f9fc;color:#0b1f3a;display:grid;place-items:center;min-height:100vh;margin:0}.c{max-width:560px;padding:32px;text-align:center}p{line-height:1.55}</style>
</head><body><div class="c"><h2 id="t">Verifying your Ethan ID…</h2><p id="m">Please wait while we securely complete your sign-in.</p></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(async()=>{
 const t=document.getElementById('t'),m=document.getElementById('m');
 const sb=supabase.createClient("https://hrymakhatxjitbgpdbjk.supabase.co","sb_publishable_lZk0iM8AuN1ITiclDFCmZA_Sn35Fek0",{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
 try{
   const u=new URL(location.href), q=u.searchParams, hp=new URLSearchParams(location.hash.replace(/^#/,''));
   // Surface Supabase verification errors clearly.
   const err=q.get('error_description')||hp.get('error_description');
   if(err) throw new Error(decodeURIComponent(err.replace(/\+/g,' ')));

   // PKCE flow: ?code=...
   const code=q.get('code');
   if(code){
     const r=await sb.auth.exchangeCodeForSession(code);
     if(r.error) throw r.error;
   }

   // Implicit verification flow: #access_token=...&refresh_token=...
   const at=hp.get('access_token'), rt=hp.get('refresh_token');
   if(at && rt){
     const r=await sb.auth.setSession({access_token:at,refresh_token:rt});
     if(r.error) throw r.error;
   }

   // detectSessionInUrl may already have established it; wait briefly then verify.
   let session=null;
   for(let i=0;i<8;i++){
     const r=await sb.auth.getSession();
     session=r.data && r.data.session;
     if(session) break;
     await new Promise(res=>setTimeout(res,250));
   }
   if(!session) throw new Error('Your email was verified, but an automatic sign-in session was not returned. Please sign in with your Ethan ID.');

   try{await sb.rpc('mark_my_ethan_email_verified')}catch(e){}
   t.textContent='Email verified successfully';
   m.textContent='Opening Ethan Hub…';
   history.replaceState({},'',location.origin+'/auth/callback');
   setTimeout(()=>location.replace(location.origin+'/'),700);
 }catch(e){
   t.textContent='Verification could not be completed';
   m.textContent=e?.message||'Please request a new verification email and try again.';
 }
})();
</script></body></html>
